# ===========================================
# Grading Auto Client - Docker Compose (Development)
# ===========================================
# Run from repo root:
#   docker compose --env-file docker/.env.local -f docker/docker-compose.dev.yml pull
#   docker compose --env-file docker/.env.local -f docker/docker-compose.dev.yml up -d
# Or: npm run docker:dev
#
# Local hot-reload (no image): npm run dev

services:
  frontend:
    image: ${DOCKER_USERNAME}/grading-auto-client:${IMAGE_TAG:-latest}
    container_name: grading-auto-client-dev
    restart: unless-stopped

    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

    ports:
      - "${FE_PORT:-3001}:3000"

    environment:
      - NODE_ENV=production
      - PORT=3000
      - HOSTNAME=0.0.0.0
      - NEXT_TELEMETRY_DISABLED=1
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL}
      - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL}

    networks:
      - grading-auto-network

    healthcheck:
      test:
        [
          "CMD",
          "wget",
          "--no-verbose",
          "--tries=1",
          "--spider",
          "http://127.0.0.1:3000",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

networks:
  grading-auto-network:
    name: grading-auto-network
    driver: bridge
